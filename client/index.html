<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casual Board Game</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <div id="app">

      <!-- Login Screen -->
      <div id="login-screen" class="panel floating-panel" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; width: 350px;">
          <h1>Welcome</h1>
          <div class="input-group">
            <input type="text" id="username-input" placeholder="Enter Username" />
          </div>
          <button id="login-btn" class="btn primary full-width">Play</button>
      </div>

      <!-- UI Layer -->

      <div id="ui-layer">
        <!-- Lobby Menu -->
        <div id="lobby-menu" class="panel">
          <h1>Casual Board Game</h1>
          <div class="input-group">
            <input type="text" id="room-id-input" placeholder="Enter Room ID" />
          </div>
          <div class="button-group">
            <button id="create-room-btn" class="btn primary">Create Room</button>
            <button id="join-room-btn" class="btn secondary">Join Room</button>
            <button id="change-name-btn" class="btn secondary" style="margin-top: 10px;">Change Name</button>
          </div>
          <p id="lobby-error" class="error-msg"></p>
        </div>

        <!-- Game Menu (Hidden by default) -->
        <div id="game-ui" class="hidden">
          <div class="top-bar">
            <span id="current-room-display">Room: None</span>
            <div class="top-bar-buttons">
                <button id="end-turn-btn" class="btn primary small">End Turn</button>
                <button id="leave-room-btn" class="btn danger small">Leave</button>
                <button id="toggle-side-panel-btn" class="btn secondary small">☰</button>
            </div>
          </div>

          <div id="side-panel" class="side-panel">
            <div class="tabs">
              <button class="tab-btn active" data-target="characters-tab" title="Characters">👥</button>
              <button class="tab-btn" data-target="props-tab" title="Props">📦</button>
              <button class="tab-btn" data-target="map-tab" title="Map Settings" id="map-tab-btn" style="display:none;">🗺️</button>
            </div>

            <div id="characters-tab" class="tab-content active">
              <h3>Characters</h3>
              <div id="character-list" class="list-container">
                  <!-- Character templates will be rendered here -->
              </div>

              <button id="open-create-char-modal-btn" class="btn primary full-width">Create New Character</button>
            </div>

            <div id="props-tab" class="tab-content">
              <h3>Props</h3>
              <div id="props-list" class="list-container">
                  <!-- Props will be rendered here -->
              </div>
            </div>

            <div id="map-tab" class="tab-content">
              <h3>Map Settings</h3>
              <div class="input-group">
                  <label for="map-cols">Columns:</label>
                  <input type="number" id="map-cols" value="20" min="5" max="100" />
              </div>
              <div class="input-group">
                  <label for="map-rows">Rows:</label>
                  <input type="number" id="map-rows" value="15" min="5" max="100" />
              </div>
              <button id="update-map-btn" class="btn primary full-width">Update Map</button>
            </div>
          </div>
        </div>
      </div>

      <!-- PixiJS Container -->
      <div id="game-container"></div>

      <!-- Character Modal -->
      <div id="character-modal" class="modal hidden">
        <div class="modal-content panel">
            <h3 id="char-modal-title">Create Character</h3>
            <input type="hidden" id="char-id" />
            <div class="input-group">
              <input type="text" id="char-name" placeholder="Name" />
            </div>
            <div class="input-group">
                <label for="char-speed">Speed:</label>
              <input type="number" id="char-speed" placeholder="Speed" value="3" min="1" max="10" />
            </div>
            <div class="input-group">
                <label for="char-health">Health:</label>
              <input type="number" id="char-health" placeholder="Health" value="10" min="1" />
            </div>
            <div class="input-group">
              <input type="text" id="char-url" placeholder="Avatar URL (Optional)" />
            </div>
            <div class="input-group">
                <label for="char-color">Color:</label>
                <input type="color" id="char-color" value="#ff0000" />
            </div>
            <div class="button-group" style="flex-direction: row; justify-content: space-between; margin-top: 1rem;">
              <button id="save-char-btn" class="btn primary">Save</button>
              <button id="close-char-modal-btn" class="btn secondary">Cancel</button>
            </div>
        </div>
      </div>

      <!-- Context Menu -->
      <div id="context-menu" class="context-menu hidden">
          <button id="cm-delete" class="cm-btn">Delete</button>
          <button id="cm-copy" class="cm-btn">Copy</button>
          <button id="cm-paste" class="cm-btn hidden">Paste</button>
          <button id="cm-toggle-visibility" class="cm-btn">Toggle Visibility</button>
          <button id="cm-change-health" class="cm-btn hidden">Change Health</button>
      </div>

      </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
